apiVersion: v1
kind: Pod
metadata:
  name: infra-resources-pod
spec:
  containers:
  - name: app-container
    image: nginx
    resources:
      requests:
        cpu: "250m"
        memory: "128Mi"
        ephemeral-storage: "500Mi"
      limits:
        cpu: "500m"
        memory: "256Mi"
        ephemeral-storage: "1Gi"